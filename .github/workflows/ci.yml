name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: autospan-ble-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install BLE with PyPI dependencies
        run: python -m pip install -e '.[dev]'
      - run: python -m pre_commit run --all-files --show-diff-on-failure
      - run: python -m mypy src
      - run: python scripts/check_readme.py
      - run: python -m pytest tests/unit
      - run: python -m compileall -q src tests scripts

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install build 'twine>=6.2'
      - run: python -m build
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - run: python scripts/check_dist.py dist
      - name: Verify installed sdist with PyPI dependencies
        run: python scripts/verify_install.py dist --distribution sdist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ble-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  installed:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ble-dist
          path: dist
      - name: Verify installed wheel with PyPI dependencies
        run: python scripts/verify_install.py dist
